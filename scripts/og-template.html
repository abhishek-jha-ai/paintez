<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;font-family:Outfit,sans-serif;background:#fff}
  .wrap{position:relative;width:1200px;height:630px}
  .photo{position:absolute;right:0;top:0;width:640px;height:630px;background:url(PHOTO) center/cover;clip-path:polygon(70px 0,100% 0,100% 100%,0 100%)}
  .accent{position:absolute;left:560px;top:0;width:80px;height:630px;background:#02aec4;clip-path:polygon(70px 0,80px 0,10px 100%,0 100%)}
  .left{position:absolute;left:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:16px}
  .brand svg{width:84px;height:84px;color:#02aec4}
  .word{line-height:1}
  .word b{font-size:54px;font-weight:700;color:#011230;letter-spacing:-1px}
  .word b span{color:#02aec4}
  .word small{display:block;margin-top:4px;font-size:15px;font-weight:600;letter-spacing:5px;color:#011230}
  h1{margin-top:44px;font-size:56px;line-height:1.04;font-weight:800;color:#011230;letter-spacing:-1.2px}
  h1 em{font-style:normal;color:#00899d}
  .rule{margin-top:26px;width:120px;height:7px;border-radius:9px;background:#02aec4}
  .svc{margin-top:26px;font-size:27px;font-weight:600;color:#3a5784;letter-spacing:.3px}
  .pill{position:absolute;right:28px;bottom:28px;background:rgba(1,18,48,.9);color:#fff;border-radius:14px;padding:14px 20px;font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
  .pill i{width:12px;height:12px;border-radius:50%;background:#2ec3d6;display:inline-block}
</style></head>
<body><div class="wrap">
  <div class="photo"></div><div class="accent"></div>
  <div class="left">
    <div class="brand">
      LOGO
      <div class="word"><b>paint<span>EZ</span></b><small>OF CLEARWATER</small></div>
    </div>
    <h1>Professional Painting.<br><em>Made Easy.</em></h1>
    <div class="rule"></div>
    <div class="svc">Interior &nbsp;•&nbsp; Exterior &nbsp;•&nbsp; Cabinets</div>
  </div>
  <div class="pill"><i></i>Clearwater, FL</div>
</div></body></html>
